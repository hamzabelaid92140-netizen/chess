services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-zinzin
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.1"
      MEMORY: "4G"
      MOTD: "Serveur de zinzin §6§l(100% vanilla client, 0 install)"
      DIFFICULTY: "hard"
      ENABLE_WHITELIST: "false"
      ONLINE_MODE: "true"
      ICON: ""
      # Plugins installés automatiquement au démarrage depuis Modrinth.
      # -> Zéro jar à télécharger à la main pour ceux-là.
      MODRINTH_PROJECTS: |
        luckperms
        essentialsx
        coreprotect
        worldedit
        chunky
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
